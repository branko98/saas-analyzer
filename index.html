<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0c1524;font-family:'DM Sans',system-ui,sans-serif;color:#e8edf4}
input:focus,textarea:focus,select:focus{border-color:#4c9acb!important;outline:none}
::placeholder{color:#3e5a7a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.cta:hover:not(:disabled){box-shadow:0 4px 24px #4c9acb44;transform:translateY(-1px)}
.cta:active:not(:disabled){transform:translateY(0)}
.sec-btn:hover:not(:disabled){border-color:#4c9acb!important;color:#4c9acb!important}
.feat-row:hover{background:#152540!important}
.add-btn:hover{border-color:#4c9acb!important;color:#4c9acb!important;background:#4c9acb18!important}
.link-card:hover{border-color:#4c9acb!important}
.evt-row{animation:slideIn .3s ease forwards}
.rm-btn:hover{color:#ef4444!important;background:#2a0f0f!important}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#162a4a;border-radius:3px}

const parseGviz = (text) => {
  try {
    const m = text.match(/setResponse\(([\s\S]*?)\)\s*;?\s*$/);
    const d = JSON.parse(m ? m[1] : text.replace(/^[^(]*\(/,'').replace(/\);?\s*$/,''));
    if (!d.table?.rows) return [];
    return d.table.rows.map(r => {
      const c = r.c||[];
      return {runId:c[0]?.v||'',timestamp:c[1]?.v||'',feature:c[2]?.v||'',
              event:c[3]?.v||'',message:c[4]?.v||'',type:c[5]?.v||''};
    });
  } catch(e) { return []; }
};

const fmtTime = (v) => {
  if (!v) return '';
  try {
    if (typeof v==='string' && v.startsWith('Date(')) {
      const p = v.match(/Date\((\d+),(\d+),(\d+),(\d+),(\d+),(\d+)\)/);
      if (p) return new Date(+p[1],+p[2],+p[3],+p[4],+p[5],+p[6])
        .toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }
    const d = new Date(v);
    return isNaN(d.getTime())?'':d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  } catch(e) { return ''; }
};

function Lbl({children,req}){
  return <label style={{display:'block',fontSize:11,fontWeight:600,color:C.dim,
    textTransform:'uppercase',letterSpacing:'.7px',marginBottom:6}}>
    {children}{req&&<span style={{color:C.blue,marginLeft:3}}>*</span>}
  </label>;
}

function Sec({icon,text,right,style={}}){
  return <div style={{fontSize:12,fontWeight:600,color:C.sec,display:'flex',
    alignItems:'center',gap:7,marginBottom:14,...style}}>
    <span style={{color:C.blue,fontSize:10}}>{icon}</span>{text}
    {right&&<span style={{marginLeft:'auto',fontWeight:400,color:C.dim}}>{right}</span>}
  </div>;
}

function Spin({size=14,color=C.white}){
  return <span style={{display:'inline-block',width:size,height:size,
    border:'2px solid '+color+'33',borderTopColor:color,borderRadius:'50%',
    animation:'spin .7s linear infinite'}}/>;
}

function Btn({children,onClick,disabled,variant='primary',style={}}){
  const base = variant==='primary'?{
    background:'linear-gradient(135deg,'+C.navy+','+C.navyLight+')',
    border:'1px solid '+C.navyLight,color:C.white,fontWeight:600,
  }:{background:'transparent',border:'1px solid '+C.border,color:C.muted,fontWeight:500};
  return <button className={variant==='primary'?'cta':'sec-btn'} onClick={onClick} disabled={disabled}
    style={{padding:'12px 24px',borderRadius:10,fontSize:14,cursor:'pointer',
      fontFamily:"'DM Sans',sans-serif",letterSpacing:'.3px',transition:'all .2s',
      opacity:disabled?.45:1,...base,...style}}>{children}</button>;
}

function App(){
  const [phase,setPhase]=useState('discover');
  const [clientName,setClientName]=useState('');
  const [homepageUrl,setHomepageUrl]=useState('');
  const [userEmail,setUserEmail]=useState('');
  const [coreDesc,setCoreDesc]=useState('');
  const [features,setFeatures]=useState([]);
  const [runId,setRunId]=useState('');
  const [sheetUrl,setSheetUrl]=useState('');
  const [events,setEvents]=useState([]);
  const [error,setError]=useState('');
  const [pollErr,setPollErr]=useState(false);
  const pollRef=useRef(null);
  const endRef=useRef(null);
  const fcRef=useRef(0);

  const handleDiscover=async()=>{
    if(!clientName.trim()||!homepageUrl.trim())return;
    setPhase('discovering');setError('');
    try{
      const res=await fetch(DISCOVERY_URL,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({client_name:clientName.trim(),homepage_url:homepageUrl.trim(),
          user_email:userEmail.trim()||'branko.j.98@gmail.com'})});
      if(!res.ok)throw new Error('Server error ('+res.status+')');
      const data=await res.json();
      if(!data.success)throw new Error('Discovery failed');
      setCoreDesc(data.core_description||'');
      const flat=[];
      (data.features||[]).forEach(f=>{
        flat.push({id:Math.random(),name:f.name,url:f.url||'',short_description:f.short_description||'',
          type:f.type||'Feature',selected:f.selected!==false,parent:''});
        (f.expansions||[]).forEach(ex=>{
          flat.push({id:Math.random(),name:ex.name,url:ex.url||f.url||'',short_description:ex.short_description||'',
            type:'Sub-feature',selected:ex.selected===true,parent:f.name});
        });
      });
      setFeatures(flat);setPhase('review');
    }catch(err){setError(err.message);setPhase('discover');}
  };

  const toggleFeat=id=>setFeatures(p=>p.map(f=>f.id===id?{...f,selected:!f.selected}:f));
  const updateFeat=(id,k,v)=>setFeatures(p=>p.map(f=>f.id===id?{...f,[k]:v}:f));
  const removeFeat=id=>setFeatures(p=>p.filter(f=>f.id!==id));
  const addCustom=()=>setFeatures(p=>[...p,{id:Math.random(),name:'',url:'',short_description:'',
    type:'Feature',selected:true,parent:'',custom:true}]);

  const handleAnalyze=async()=>{
    const sel=features.filter(f=>f.selected&&f.name.trim());
    if(!sel.length)return;
    setPhase('submitting');setError('');fcRef.current=sel.length;
    try{
      const res=await fetch(ANALYSIS_URL,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({client_name:clientName.trim(),core_description:coreDesc.trim(),
          user_email:userEmail.trim()||'branko.j.98@gmail.com',
          features:sel.map(f=>({name:f.name.trim(),url:f.url.trim(),
            short_description:f.short_description.trim(),type:f.type,parent_feature:f.parent||''}))})});
      if(!res.ok)throw new Error('Server error ('+res.status+')');
      const data=await res.json();
      if(!data.success)throw new Error(data.message||'Failed');
      setRunId(data.run_id);setSheetUrl(data.sheet_url);
      setPhase('running');startPoll(data.run_id);
    }catch(err){setError(err.message);setPhase('review');}
  };

  const fetchEvts=useCallback(async(rid)=>{
    const tq=encodeURIComponent("SELECT * WHERE A = '"+rid+"'");
    const url='https://docs.google.com/spreadsheets/d/'+MASTER_LOG_ID+'/gviz/tq?tqx=out:json&sheet=Events&tq='+tq+'&headers=1&_t='+Date.now();
    try{
      const res=await fetch(url);
      if(!res.ok){setPollErr(true);return;}
      const rows=parseGviz(await res.text());
      setPollErr(false);
      if(rows.length>0){
        setEvents(rows);
        if(rows.some(r=>r.type==='complete')){
          setPhase('complete');
          if(pollRef.current){clearInterval(pollRef.current);pollRef.current=null;}
        }
      }
    }catch(e){setPollErr(true);}
  },[]);

  const startPoll=useCallback((rid)=>{
    fetchEvts(rid);
    pollRef.current=setInterval(()=>fetchEvts(rid),POLL_INTERVAL);
  },[fetchEvts]);

  useEffect(()=>()=>{if(pollRef.current)clearInterval(pollRef.current);},[]);
  useEffect(()=>{
    if(endRef.current&&phase==='running')endRef.current.scrollIntoView({behavior:'smooth',block:'nearest'});
  },[events,phase]);

  const handleReset=()=>{
    if(pollRef.current){clearInterval(pollRef.current);pollRef.current=null;}
    setPhase('discover');setClientName('');setHomepageUrl('');setUserEmail('');
    setCoreDesc('');setFeatures([]);setRunId('');setSheetUrl('');
    setEvents([]);setError('');setPollErr(false);
  };

  const selCount=features.filter(f=>f.selected&&f.name.trim()).length;
  const done=events.filter(e=>e.event==='FEATURE_DONE').length;
  const total=fcRef.current||selCount;
  const warns=events.filter(e=>e.type==='alert_warning');
  const crits=events.filter(e=>e.type==='alert_critical');
  const compEvt=events.find(e=>e.type==='complete');
  const isComp=phase==='complete';
  const pct=isComp?100:Math.min(95,total>0?Math.round((done/total)*90)+5:3);
  const dis=phase==='discovering'||phase==='submitting';

  return (
    <div style={{maxWidth:800,margin:'0 auto',padding:'36px 20px 60px'}}>
      <div style={{marginBottom:44}}>
        <img src={LOGO_SRC} alt="Impactable" style={{height:38,width:'auto'}}/>
      </div>

      {phase!=='discover'&&(
        <div style={{display:'flex',gap:4,marginBottom:28}}>
          {['Discovery','Review','Analysis'].map((label,i)=>{
            const sp=[['discovering'],['review','submitting'],['running','complete']];
            const active=sp[i].includes(phase);
            const past=i===0?['review','submitting','running','complete'].includes(phase)
              :i===1?['running','complete'].includes(phase):isComp;
            return(
              <div key={i} style={{flex:1,textAlign:'center'}}>
                <div style={{height:3,borderRadius:2,marginBottom:6,
                  background:past?C.green:active?C.blue:C.border,transition:'background .4s'}}/>
                <span style={{fontSize:11,color:past?C.green:active?C.blue:C.dim,
                  fontWeight:active?600:400}}>{label}</span>
              </div>
            );
          })}
        </div>
      )}

      {error&&(
        <div style={{background:C.redBg,border:'1px solid '+C.redBdr,borderRadius:10,
          padding:'13px 18px',marginBottom:14,color:'#fca5a5',fontSize:13,
          display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:15}}>{'\u2715'}</span><span>{error}</span>
        </div>
      )}

      {(phase==='discover'||phase==='discovering')&&(
        <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:12,padding:28}}>
          <div style={{fontSize:15,fontWeight:600,color:C.text,marginBottom:4}}>Start New Analysis</div>
          <div style={{fontSize:13,color:C.muted,marginBottom:24,lineHeight:1.5}}>
            Enter the client's website and we'll automatically discover their product features.
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
              <div><Lbl req>Client Name</Lbl>
                <input style={inp} placeholder="e.g. Kong, Sisense" value={clientName}
                  onChange={e=>setClientName(e.target.value)} disabled={dis}/></div>
              <div><Lbl req>Homepage URL</Lbl>
                <input style={inp} placeholder="https://konghq.com" value={homepageUrl}
                  onChange={e=>setHomepageUrl(e.target.value)} disabled={dis}/></div>
            </div>
            <div><Lbl>Your Email</Lbl>
              <input style={inp} type="email" placeholder="email@company.com" value={userEmail}
                onChange={e=>setUserEmail(e.target.value)} disabled={dis}/></div>
          </div>
          <Btn onClick={handleDiscover} disabled={!clientName.trim()||!homepageUrl.trim()||dis}
            style={{width:'100%',marginTop:24}}>
            {phase==='discovering'?
              <span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
                <Spin/> Discovering Features...</span>:'Discover Features'}
          </Btn>
          {phase==='discovering'&&(
            <div style={{textAlign:'center',marginTop:14,fontSize:12,color:C.dim}}>
              Scanning website and analyzing features. This takes 30-60 seconds...
            </div>
          )}
        </div>
      )}

      {(phase==='review'||phase==='submitting')&&(<>
        <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:12,
          padding:'18px 22px',marginBottom:14}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <span style={{fontSize:14,fontWeight:600,color:C.text}}>{clientName}</span>
            <span style={{fontSize:11,color:C.dim,fontFamily:MF}}>{homepageUrl}</span>
          </div>
          <Lbl>Core Description</Lbl>
          <textarea style={{...inp,minHeight:56,resize:'vertical'}} value={coreDesc}
            onChange={e=>setCoreDesc(e.target.value)} disabled={dis}/>
        </div>

        <Sec icon={'\u25C6'} text="Discovered Features" right={selCount+' of '+features.length+' selected'}/>

        <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:12}}>
          {features.map(f=>(
            <div key={f.id} className="feat-row" style={{
              background:C.surface,border:'1px solid '+(f.selected?C.border:C.borderSoft),
              borderRadius:10,padding:'14px 16px',transition:'all .2s',
              opacity:f.selected?1:.5,marginLeft:f.parent?24:0}}>
              <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
                <button onClick={()=>toggleFeat(f.id)} disabled={dis}
                  style={{width:20,height:20,borderRadius:5,flexShrink:0,marginTop:1,cursor:'pointer',
                    border:'2px solid '+(f.selected?C.blue:C.border),
                    background:f.selected?C.blue:'transparent',
                    display:'flex',alignItems:'center',justifyContent:'center',
                    color:C.white,fontSize:12,fontWeight:700,transition:'all .15s'}}>
                  {f.selected?'\u2713':''}</button>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}>
                    {f.custom?<input style={{...inp,padding:'4px 8px',fontSize:13,fontWeight:600}}
                      placeholder="Feature name..." value={f.name}
                      onChange={e=>updateFeat(f.id,'name',e.target.value)} disabled={dis}/>
                    :<span style={{fontSize:13,fontWeight:600,color:C.text}}>{f.name}</span>}
                    <span style={{fontSize:10,padding:'2px 8px',borderRadius:12,fontWeight:600,flexShrink:0,
                      background:f.type==='Feature'?C.bluePale:f.type==='Core'?C.navy+'44':C.amber+'18',
                      color:f.type==='Feature'?C.blue:f.type==='Core'?C.sec:C.amber}}>{f.type}</span>
                  </div>
                  {f.custom?<>
                    <input style={{...inp,padding:'4px 8px',fontSize:12,marginBottom:4}}
                      placeholder="Short description..." value={f.short_description}
                      onChange={e=>updateFeat(f.id,'short_description',e.target.value)} disabled={dis}/>
                    <input style={{...inp,padding:'4px 8px',fontSize:12}}
                      placeholder="https://..." value={f.url}
                      onChange={e=>updateFeat(f.id,'url',e.target.value)} disabled={dis}/>
                  </>:<>
                    <div style={{fontSize:12,color:C.muted,lineHeight:1.4}}>{f.short_description}</div>
                    {f.url&&<div style={{fontSize:11,color:C.dim,fontFamily:MF,marginTop:2,
                      overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.url}</div>}
                  </>}
                </div>
                {f.custom&&<button className="rm-btn" onClick={()=>removeFeat(f.id)} disabled={dis}
                  style={{background:'none',border:'none',color:C.dim,cursor:'pointer',
                    fontSize:16,padding:'2px 6px',borderRadius:4,transition:'all .15s'}}>{'\u00D7'}</button>}
              </div>
            </div>
          ))}
        </div>

        <button className="add-btn" onClick={addCustom} disabled={dis}
          style={{width:'100%',padding:'10px',background:'transparent',
            border:'1px dashed '+C.border,borderRadius:10,
            color:C.muted,fontSize:13,fontWeight:500,cursor:'pointer',
            fontFamily:"'DM Sans',sans-serif",transition:'all .2s',marginBottom:8}}>
          + Add Custom Feature</button>

        <div style={{display:'flex',gap:10,marginTop:16}}>
          <Btn variant="secondary" onClick={()=>{setPhase('discover');setFeatures([]);}}
            disabled={dis}>{'\u2190'} Back</Btn>
          <Btn onClick={handleAnalyze} disabled={selCount===0||dis} style={{flex:1}}>
            {phase==='submitting'?
              <span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
                <Spin/> Starting Analysis...</span>
              :'Start Analysis \u2014 '+selCount+' feature'+(selCount!==1?'s':'')}
          </Btn>
        </div>
      </>)}

      {(phase==='running'||phase==='complete')&&(<>
        {isComp&&(
          <div style={{background:C.greenBg,border:'1px solid '+C.greenBdr,borderRadius:12,
            padding:'26px 24px',textAlign:'center',marginBottom:16}}>
            <div style={{width:44,height:44,borderRadius:'50%',margin:'0 auto 12px',
              background:C.green+'1a',display:'flex',alignItems:'center',justifyContent:'center',
              fontSize:20,color:C.green}}>{'\u2713'}</div>
            <div style={{fontSize:17,fontWeight:700,color:C.green,marginBottom:6}}>Analysis Complete</div>
            <div style={{fontSize:13,color:'#86efac',lineHeight:1.5}}>
              {compEvt?.message||done+' feature'+(done!==1?'s':'')+' analyzed'}</div>
            {(warns.length>0||crits.length>0)&&(
              <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:14,flexWrap:'wrap'}}>
                {warns.length>0&&<span style={{padding:'3px 12px',borderRadius:20,fontSize:12,fontWeight:600,
                  background:C.amberBg,color:C.amber,border:'1px solid '+C.amberBdr}}>
                  {'\u25B2'} {warns.length} warning{warns.length!==1?'s':''}</span>}
                {crits.length>0&&<span style={{padding:'3px 12px',borderRadius:20,fontSize:12,fontWeight:600,
                  background:C.redBg,color:C.red,border:'1px solid '+C.redBdr}}>
                  {'\u2715'} {crits.length} critical</span>}
              </div>
            )}
          </div>
        )}

        <a href={sheetUrl} target="_blank" rel="noopener noreferrer" className="link-card"
          style={{display:'block',textDecoration:'none',marginBottom:16,
            background:C.surface,border:'1px solid '+C.border,borderRadius:12,
            padding:'18px 22px',transition:'border-color .2s'}}>
          <div style={{fontSize:10,color:C.muted,textTransform:'uppercase',
            letterSpacing:'.8px',fontWeight:600,marginBottom:8,
            display:'flex',alignItems:'center',gap:6}}>
            <span style={{fontSize:13}}>{'\uD83D\uDCCA'}</span> Results Spreadsheet</div>
          <div style={{fontSize:13,color:C.blue,fontFamily:MF,wordBreak:'break-all',lineHeight:1.4}}>
            {sheetUrl}</div>
        </a>

        {!isComp&&(
          <div style={{marginBottom:20}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:6,padding:'0 2px'}}>
              <span style={{fontSize:12,color:C.muted}}>Processing features...</span>
              <span style={{fontSize:12,color:C.blue,fontFamily:MF,fontWeight:500}}>{done}/{total}</span>
            </div>
            <div style={{height:3,background:C.border,borderRadius:2,overflow:'hidden'}}>
              <div style={{height:'100%',borderRadius:2,width:pct+'%',
                background:'linear-gradient(90deg,'+C.navy+','+C.blue+')',
                backgroundSize:'200% 100%',animation:'shimmer 2s linear infinite',
                transition:'width .8s ease'}}/></div>
          </div>
        )}

        <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:12,padding:'18px 14px'}}>
          <Sec icon={'\u25C6'} text="Event Log" style={{padding:'0 6px',marginBottom:10}}/>
          {events.length===0&&!isComp&&(
            <div style={{textAlign:'center',padding:'28px 16px',color:C.dim,fontSize:13}}>
              <Spin size={16} color={C.dim}/>
              <div style={{marginTop:8}}>Waiting for events...</div>
            </div>
          )}
          <div style={{maxHeight:420,overflowY:'auto',paddingRight:4}}>
            {events.map((evt,i)=>{
              const s=evtS[evt.type]||evtS.system;
              const isAl=evt.type==='alert_warning'||evt.type==='alert_critical';
              return(
                <div key={i} className="evt-row" style={{display:'flex',gap:12,padding:'10px 12px',
                  borderRadius:8,marginBottom:4,alignItems:'flex-start',
                  background:s.bg,borderLeft:isAl?'3px solid '+s.c:'3px solid transparent'}}>
                  <div style={{width:22,height:22,borderRadius:6,flexShrink:0,marginTop:1,
                    display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:10,fontWeight:700,color:s.c,background:s.c+'18'}}>{s.i}</div>
                  <div style={{fontFamily:MF,fontSize:11,color:C.dim,
                    minWidth:64,marginTop:3,flexShrink:0}}>{fmtTime(evt.timestamp)}</div>
                  <div style={{flex:1,minWidth:0}}>
                    {evt.feature&&<div style={{fontSize:12,fontWeight:600,color:s.c,marginBottom:2}}>
                      {evt.feature}</div>}
                    <div style={{fontSize:13,color:isAl?'#ddd':C.sec,lineHeight:1.45,
                      wordBreak:'break-word'}}>{evt.message}</div>
                  </div>
                </div>
              );
            })}
            <div ref={endRef}/>
          </div>
        </div>

        {!isComp?(
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',
            gap:8,padding:'14px 0',fontSize:12,color:C.dim}}>
            <div style={{width:6,height:6,borderRadius:'50%',
              background:pollErr?C.amber:C.blue,animation:'pulse 2s ease-in-out infinite'}}/>
            <span>{pollErr?'Retrying...':'Polling every '+(POLL_INTERVAL/1000)+'s'}</span>
          </div>
        ):(
          <div style={{textAlign:'center',marginTop:14}}>
            <Btn variant="secondary" onClick={handleReset}>{'\u2190'} New Analysis</Btn>
          </div>
        )}
      </>)}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
